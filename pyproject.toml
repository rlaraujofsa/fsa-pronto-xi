[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsa-pronto-xi"
version = "0.1.0"
dependencies = [
    "selenium>=4.51.0",
    "webdriver-manager>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.22.3",
    "black>=26.10.1",
    "python-dotenv>=1.2.4",
]

[tool.setuptools]
py-modules = ["main", "config", "checkpoint", "pronto"]
